[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-auth-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi",
    "fastapi",
    "pymongo",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = ["httpx", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
